name: Build EXE

on:
  push:
    branches: [ "main" ] # Hoặc "master" tùy nhánh của bạn

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v2.334.0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install Pillow pyinstaller
        
    - name: Build with PyInstaller
      run: pyinstaller --noconsole --onefile app.py
      
    - name: Upload Artifact
      uses: actions/upload-artifact@v2.334.0
      with:
        name: ung-dung-trong-suot
        path: dist/app.exe
